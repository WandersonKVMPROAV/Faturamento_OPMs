<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KVM Pro AV | Recorrência de cobrança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1C7A88; --teal-dark:#125A66; --navy:#2E4756; --gold:#D9A04B;
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F5F8F8; --border:#DFE6E5;
  --text:#20303A; --text-muted:#5C6870; --teal-tint:#E4F1F2;
  --c-sav:#1C7A88; --c-gasto:#9AAEB8; --c-neg:#C1584B; --c-ok:#3E8A64; --c-mid:#C28526; --c-plum:#6B5CA5;
  --c-urg:#C1584B; --c-nor:#C28526; --c-nc:#8A9EA9;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-1:0 1px 2px rgba(32,48,58,.06);
  --shadow-2:0 10px 30px rgba(20,32,40,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1517; --surface:#182024; --surface-2:#141B1E; --border:#283134;
    --text:#EAF0EF; --text-muted:#93A2A6; --teal-tint:#0F3339;
    --c-sav:#38B3C2; --c-gasto:#5B7482; --c-neg:#E27C6F; --c-ok:#5FB58C; --c-mid:#E2AB55; --c-plum:#A194DD;
    --c-urg:#E27C6F; --c-nor:#E2AB55; --c-nc:#7D929C;
    --shadow-1:0 1px 2px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1517; --surface:#182024; --surface-2:#141B1E; --border:#283134;
  --text:#EAF0EF; --text-muted:#93A2A6; --teal-tint:#0F3339;
  --c-sav:#38B3C2; --c-gasto:#5B7482; --c-neg:#E27C6F; --c-ok:#5FB58C; --c-mid:#E2AB55; --c-plum:#A194DD;
  --c-urg:#E27C6F; --c-nor:#E2AB55; --c-nc:#7D929C;
  --shadow-1:0 1px 2px rgba(0,0,0,.25);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{box-sizing:inherit;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.45;
}
h1,h2,h3{font-family:'Space Grotesk','Inter',system-ui,sans-serif;}
button,select,input{font-family:inherit;}
a{color:var(--c-sav);}
.num{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ===== Shell ===== */
.app-shell{ display:flex; min-height:100%; }
.sidebar{
  width:236px; flex:none; background:var(--navy); color:#fff;
  display:flex; flex-direction:column; padding:20px 14px 16px;
  position:sticky; top:env(safe-area-inset-top,0px);
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overflow-y:auto;
}
.sidebar-brand{ display:flex; flex-direction:column; gap:10px; padding:2px 8px 18px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px; }
.sidebar-brand img{ height:34px; width:auto; align-self:flex-start; }
.sidebar-brand .subtitle{ font-size:12px; color:rgba(255,255,255,.7); line-height:1.35; }
.sidebar-nav{ display:flex; flex-direction:column; gap:3px; }
.sidebar-nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:rgba(255,255,255,.74); font-size:13.5px; font-weight:600; cursor:pointer;
  background:transparent; border:none; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.sidebar-nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
.sidebar-nav-item.active{ background:var(--teal); color:#fff; }
.sidebar-nav-item .icon{ font-size:15px; width:18px; text-align:center; flex:none; }
.sidebar-nav-item .cnt{ margin-left:auto; font-size:11.5px; background:rgba(255,255,255,.14); padding:1px 7px; border-radius:20px; }
.sidebar-foot{ margin-top:auto; padding:14px 8px 0; border-top:1px solid rgba(255,255,255,.12); font-size:11.5px; color:rgba(255,255,255,.62); line-height:1.55; }
.sidebar-foot b{ color:rgba(255,255,255,.88); font-weight:600; }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.app-shell.side-hidden .sidebar{ display:none; }
.app-shell.side-hidden main{ max-width:1520px; }
.tb-lead{ display:flex; align-items:center; gap:10px; }
.btn-icon{ width:36px; height:36px; padding:0 !important; justify-content:center; font-size:17px; line-height:1; }
.tb-title{ font-family:'Space Grotesk','Inter',sans-serif; font-weight:700; font-size:15px; white-space:nowrap; margin-right:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.main-topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px 22px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
}
main{ max-width:1340px; width:100%; margin:0 auto; padding:20px 20px 60px; }

@media (max-width:860px){
  .app-shell{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; }
  .sidebar-brand{ border-bottom:none; border-right:1px solid rgba(255,255,255,.14); margin-bottom:0; padding:0 12px 0 2px; flex:none; }
  .sidebar-brand img{ height:24px; }
  .sidebar-brand .subtitle, .sidebar-foot{ display:none; }
  .sidebar-nav{ flex-direction:row; padding-left:10px; }
  .sidebar-nav-item{ white-space:nowrap; }
  .main-topbar{ position:static; padding:10px 12px; }
  main{ padding:14px 12px 48px; }
}

/* ===== Filtros ===== */
.flt{ display:inline-flex; align-items:center; gap:2px; border:1px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm); padding:0 2px 0 10px; }
.flt > span{ font-size:12px; color:var(--text-muted); font-weight:600; }
.flt select{ border:0; background:transparent; color:var(--text); font-weight:600; padding:8px 6px; font-size:13px; cursor:pointer; max-width:200px; }
.flt select option{ background:var(--surface); color:var(--text); }
.flt.is-set{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
.flt.week{ background:var(--teal-tint); border-color:color-mix(in srgb, var(--teal) 45%, transparent); }
.topbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn{ border:none; padding:8px 14px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px; }
.btn-primary{ background:var(--teal); color:#fff; }
.btn-primary:hover{ background:var(--teal-dark); }
.btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover{ background:var(--surface-2); }
.link-btn{ background:none; border:0; padding:0; color:var(--c-sav); font-weight:600; cursor:pointer; font-size:inherit; }
.link-btn:hover{ text-decoration:underline; }
@media (max-width:640px){
  .main-topbar{ display:grid; grid-template-columns:1fr 1fr; }
  .flt{ min-width:0; }
  .flt select{ width:100%; max-width:none; min-width:0; }
  .topbar-right, .tb-lead{ grid-column:1 / -1; }
  .topbar-right{ margin-left:0; }
}

/* ===== Cabeçalho de página ===== */
.page-banner{
  background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
  color:#fff; border-radius:var(--radius-lg); padding:16px 22px;
  position:relative; overflow:hidden; margin-bottom:16px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.page-banner::after{ content:""; position:absolute; top:-40px; right:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none; }
.page-banner h2{ margin:0; font-size:19px; position:relative; }
.page-banner p{ margin:2px 0 0; font-size:13px; color:rgba(255,255,255,.8); position:relative; max-width:70ch; }
.page-banner input{ position:relative; z-index:1; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px; min-width:260px; }
.page-banner input::placeholder{ color:rgba(255,255,255,.7); }
@media (max-width:640px){ .page-banner input{ min-width:0; width:100%; } }

/* ===== Hero ===== */
.dash-hero-row{ display:grid; grid-template-columns:1.15fr 1fr; gap:16px; margin-bottom:16px; }
.dash-hero-card{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
  color:#fff; padding:20px 24px; min-height:150px;
}
.dash-hero-card.alt{ background:linear-gradient(135deg, #3A3F57 0%, var(--navy) 100%); }
.dash-hero-card::after{ content:""; position:absolute; top:-40px; right:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.06); pointer-events:none; }
.dash-hero-label{ font-size:12.5px; font-weight:600; color:var(--gold); position:relative; }
.dash-hero-big{ font-family:'Space Grotesk',sans-serif; font-size:36px; font-weight:700; margin:4px 0 2px; position:relative; line-height:1.1; }
.dash-hero-big small{ font-size:18px; font-weight:600; color:rgba(255,255,255,.75); }
.dash-hero-sub{ font-size:13px; color:rgba(255,255,255,.8); margin-bottom:14px; position:relative; max-width:56ch; }
.dash-hero-items{ display:flex; flex-wrap:wrap; gap:10px; position:relative; }
.dash-hero-item{ background:rgba(255,255,255,.12); border-radius:12px; padding:9px 13px; min-width:150px; flex:1; border:0; color:#fff; text-align:left; cursor:pointer; font:inherit; }
.dash-hero-item:hover{ background:rgba(255,255,255,.18); }
.dash-hero-item.on{ box-shadow:inset 0 0 0 2px var(--gold); }
.dash-hero-item .i-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:#fff; white-space:nowrap; }
.dash-hero-item .i-sub{ font-size:11.5px; color:rgba(255,255,255,.82); margin-top:2px; display:flex; align-items:center; gap:6px; }
.dash-hero-item .sw{ width:8px; height:8px; border-radius:50%; flex:none; }
.stackbar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,.12); margin:0 0 14px; position:relative; }
.stackbar span{ display:block; height:100%; }

/* ===== Indicadores ===== */
.dash-stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
.dash-stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:15px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1); min-width:0; }
.dash-stat-icon{ width:40px; height:40px; border-radius:10px; background:var(--teal-tint); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
.dash-stat-value{ font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; white-space:nowrap; }
.dash-stat-label{ font-size:12.5px; font-weight:600; margin-top:1px; }
.dash-stat-hint{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dash-stat-card > div:last-child{ min-width:0; }
@media (max-width:1060px){ .dash-stats-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:860px){ .dash-hero-row{ grid-template-columns:1fr; } .dash-hero-big{ font-size:30px; } }
@media (max-width:440px){ .dash-stats-row{ grid-template-columns:1fr; } }

/* ===== Cards ===== */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px 18px; box-shadow:var(--shadow-1); min-width:0; }
.card + .card{ margin-top:16px; }
.card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; margin-bottom:12px; }
.card-head h3{ margin:0; font-size:16px; font-weight:700; }
.card-head p{ margin:3px 0 0; font-size:12.5px; color:var(--text-muted); max-width:64ch; }
.row-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-bottom:16px; }
.row-2b{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
.row-2 > .card + .card, .row-2b > .card + .card{ margin-top:0; }
@media (max-width:1060px){ .row-2, .row-2b{ grid-template-columns:1fr; } }

.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--text-muted); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

/* ===== Leitura rápida ===== */
.insights{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin-bottom:16px; padding:0; overflow:hidden; }
.insight{ padding:14px 18px; display:flex; gap:12px; align-items:flex-start; }
.insight + .insight{ border-left:1px solid var(--border); }
.insight .mark{ width:6px; align-self:stretch; border-radius:4px; flex:none; background:var(--c-sav); }
.insight b{ font-family:'Space Grotesk',sans-serif; font-size:15px; display:block; margin-bottom:2px; }
.insight span{ font-size:12.5px; color:var(--text-muted); }
@media (max-width:900px){ .insights{ grid-template-columns:1fr; } .insight + .insight{ border-left:0; border-top:1px solid var(--border); } }

/* ===== Listas de barras ===== */
.bar-list{ display:flex; flex-direction:column; gap:4px; }
.bar-item{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 104px; align-items:center; gap:10px; padding:7px 8px; border-radius:9px; border:1px solid transparent; background:transparent; color:var(--text); text-align:left; cursor:pointer; width:100%; font-size:13px; }
.bar-item:hover{ background:var(--surface-2); }
.bar-item.sel{ border-color:var(--teal); background:var(--teal-tint); }
.bar-item.static{ cursor:default; }
.bar-item.static:hover{ background:transparent; }
.bar-item .k{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-item .k small{ display:block; font-weight:400; font-size:11.5px; color:var(--text-muted); }
.bar-item .track{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; position:relative; display:flex; }
.bar-item .track span{ display:block; height:100%; }
.bar-item .v{ font-weight:600; font-size:12.5px; white-space:nowrap; text-align:right; }

/* ===== Badges ===== */
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.badge.urg{ color:var(--c-urg); background:color-mix(in srgb, var(--c-urg) 14%, transparent); }
.badge.nor{ color:var(--c-nor); background:color-mix(in srgb, var(--c-nor) 16%, transparent); }
.badge.nc{ color:var(--c-nc); background:color-mix(in srgb, var(--c-nc) 20%, transparent); }
.badge.done{ color:var(--c-ok); background:color-mix(in srgb, var(--c-ok) 14%, transparent); }
.badge.open{ color:var(--c-mid); background:color-mix(in srgb, var(--c-mid) 16%, transparent); }
.badge.late{ color:var(--c-neg); background:color-mix(in srgb, var(--c-neg) 14%, transparent); }
.badge.muted{ color:var(--text-muted); background:color-mix(in srgb, var(--c-gasto) 20%, transparent); }
.badge.cob{ color:var(--c-plum); background:color-mix(in srgb, var(--c-plum) 16%, transparent); }
.badge.plain::before{ display:none; }

/* ===== Tabela ===== */
.tbl-wrap{ overflow-x:auto; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
.tbl th{ font-size:12px; color:var(--text-muted); font-weight:600; text-align:right; padding:8px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
.tbl td{ padding:9px 7px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:top; }
.tbl th:first-child, .tbl td:first-child{ text-align:left; padding-left:2px; }
.tbl tr.total td{ font-weight:700; border-bottom:0; }
.tbl th.sort{ cursor:pointer; user-select:none; }
.tbl th.sort:hover, .tbl th.sort.on{ color:var(--text); }
.tbl td.txt, .tbl th.txt{ text-align:left; }
.tbl tbody tr.click{ cursor:pointer; }
.tbl tbody tr.click:hover td{ background:var(--surface-2); }
.tbl tr.open td{ background:var(--surface-2); border-bottom-color:transparent; }
.tbl tr.sub > td{ background:var(--surface-2); padding:2px 12px 18px; white-space:normal; text-align:left; }
.opm-cell{ min-width:210px; max-width:340px; white-space:normal !important; }
.opm-cell b{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }
.opm-cell b .cli{ font-family:'Inter',sans-serif; font-weight:600; font-size:12px; color:var(--text-muted); margin-left:2px; }
.det-wrap{ position:sticky; left:12px; }
.opm-cell b .chev{ font-size:10px; color:var(--text-muted); transition:transform .15s; display:inline-block; }
tr.open .opm-cell b .chev{ transform:rotate(90deg); }
.tbl td.wrapc{ white-space:normal; min-width:92px; max-width:130px; }
.cell-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; font-weight:400; }
.dim{ color:var(--text-muted); }

/* ===== Detalhe da OPM ===== */
.det{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(250px,.85fr); gap:14px; }
@media (max-width:1100px){ .det{ grid-template-columns:1fr 1fr; } .det > .det-side{ grid-column:1 / -1; } }
@media (max-width:700px){ .det{ grid-template-columns:1fr; } }
.det-col{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; min-width:0; }
.det-col h4{ margin:0 0 10px; font-size:13px; font-family:'Space Grotesk',sans-serif; display:flex; justify-content:space-between; gap:8px; }
.det-col h4 span{ font-family:'Inter',sans-serif; font-weight:500; color:var(--text-muted); font-size:12px; }
.tl{ list-style:none; margin:0; padding:0; position:relative; }
.tl li{ position:relative; padding:0 0 11px 20px; font-size:12.5px; line-height:1.4; }
.tl li::before{ content:""; position:absolute; left:4px; top:5px; width:8px; height:8px; border-radius:50%; background:var(--c-gasto); }
.tl li::after{ content:""; position:absolute; left:7.5px; top:15px; bottom:-1px; width:1px; background:var(--border); }
.tl li:last-child{ padding-bottom:0; }
.tl li:last-child::after{ display:none; }
.tl li.now::before{ background:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.tl li.c-contato::before{ background:var(--c-sav); }
.tl li.c-late::before{ background:var(--c-neg); }
.tl .when{ font-size:11.5px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-bottom:2px; }
.tl .when .badge{ font-size:10.5px; padding:1px 7px; }
.tl .what{ overflow-wrap:anywhere; }
.tl .nota{ color:var(--text-muted); margin-top:2px; }
.kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.kpi{ background:var(--surface-2); border-radius:10px; padding:8px 10px; }
.kpi .l{ font-size:11.5px; color:var(--text-muted); }
.kpi .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }
.contact{ font-size:12.5px; border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:3px; overflow-wrap:anywhere; }
.contact .l{ font-size:11.5px; color:var(--text-muted); }
.links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.links a{ font-size:12.5px; font-weight:600; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--text); background:var(--surface-2); }
.links a:hover{ border-color:var(--teal); }
.empty-note{ font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:10px 12px; }

/* ===== Agenda ===== */
.agenda{ display:flex; flex-direction:column; }
.ag-item{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
.ag-item:first-child{ border-top:0; padding-top:2px; }
.ag-date{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; text-align:center; min-width:48px; padding:5px 6px; border-radius:9px; background:var(--surface-2); line-height:1.2; }
.ag-date small{ display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:10.5px; color:var(--text-muted); }
.ag-date.late{ background:color-mix(in srgb, var(--c-neg) 14%, transparent); color:var(--c-neg); }
.ag-main b{ font-weight:600; }
.ag-main .cell-sub{ overflow-wrap:anywhere; }
.mini-title{ font-size:12.5px; font-weight:700; margin:14px 0 4px; color:var(--text-muted); }

/* ===== Recorrência ===== */
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ font-family:'Inter',system-ui,sans-serif; }
.chart .ax{ fill:var(--text-muted); font-size:11px; }
.chart .grid{ stroke:var(--border); stroke-width:1; }
.chart .lbl{ fill:var(--text); font-size:11.5px; font-weight:700; }
.chart .hit{ cursor:pointer; }
.chart .hit.sel .frame{ stroke:var(--gold); stroke-width:2; }
.weeks{ display:inline-flex; gap:3px; vertical-align:middle; }
.weeks i{ width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--border); background:transparent; }
.mv-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.mv{ background:var(--surface-2); border-radius:12px; padding:11px 13px; }
.mv .t{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; }
.mv .l{ font-size:12px; font-weight:600; }
.mv .s{ font-size:11.5px; color:var(--text-muted); }
.mv-list{ margin-top:10px; font-size:12.5px; display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:1px solid var(--border); border-radius:20px; padding:2px 9px; font-size:12px; background:var(--surface); color:var(--text); cursor:pointer; }
.chip:hover{ border-color:var(--teal); }
@media (max-width:640px){ .mv-grid{ grid-template-columns:1fr; } }

.empty-state{ text-align:center; padding:36px 16px; color:var(--text-muted); }
.empty-state b{ display:block; color:var(--text); font-size:15px; margin-bottom:4px; font-family:'Space Grotesk',sans-serif; }


/* ===== Etapas (kanban) ===== */
.stg-row{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.flt.is-off{ opacity:.45; }
.stg{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px 13px 12px; text-align:left; cursor:pointer; color:var(--text); font:inherit; border-top:3px solid var(--sc); }
.stg:hover{ border-color:var(--sc); }
.stg .l{ font-size:12.5px; font-weight:700; display:flex; justify-content:space-between; gap:6px; }
.stg .l span{ font-weight:600; color:var(--text-muted); }
.stg .v{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-top:3px; }
.stg .s{ font-size:11.5px; color:var(--text-muted); }
.foot-note{ font-size:12px; color:var(--text-muted); margin-top:10px; }
@media (max-width:1100px){ .stg-row{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:640px){ .stg-row{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kb{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(272px,1fr); gap:12px; overflow-x:auto; padding-bottom:6px; align-items:start; }
.kb-col{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; max-height:calc(100vh - 210px); min-height:260px; overflow:hidden; }
.kb-head{ padding:12px 14px 10px; border-bottom:1px solid var(--border); border-top:4px solid var(--sc); background:var(--surface); }
.kb-head h3{ margin:0; font-size:15px; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.kb-head h3 span{ font-family:'Inter',sans-serif; font-size:12px; color:var(--text-muted); font-weight:600; }
.kb-head .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin-top:2px; }
.kb-head p{ margin:2px 0 0; font-size:11.5px; color:var(--text-muted); }
.kb-list{ overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.kb-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--lc,var(--border)); border-radius:11px; padding:9px 11px; text-align:left; cursor:pointer; color:var(--text); font:inherit; width:100%; display:flex; flex-direction:column; gap:4px; }
.kb-card:hover{ border-color:var(--teal); border-left-color:var(--lc,var(--teal)); }
.kb-card .top{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
.kb-card .top b{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; }
.kb-card .cl{ font-size:12px; font-weight:600; color:var(--text-muted); }
.kb-card .tt{ font-size:12px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.kb-card .bt{ display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:12px; margin-top:2px; flex-wrap:wrap; }
.kb-card .bt b{ font-size:13px; }
.kb-card .badge{ font-size:10.5px; padding:1px 7px; }
.kb-more{ margin:2px 0 4px; align-self:center; }

/* ===== Pauta ===== */
.pt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr)); gap:14px; }
.pt-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px 16px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:10px; min-width:0; }
.pt-card.done{ opacity:.78; }
.pt-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.pt-head b{ font-family:'Space Grotesk',sans-serif; font-size:16px; }
.pt-head .cell-sub{ font-size:12px; }
.pt-comment{ font-size:15px; line-height:1.5; background:var(--surface-2); border-left:3px solid var(--gold); border-radius:4px 10px 10px 4px; padding:10px 13px; overflow-wrap:anywhere; }
.pt-meta{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--text-muted); }
.pt-meta b{ color:var(--text); font-weight:600; }
.pt-last{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:9px; }
.pt-last b{ color:var(--text); font-weight:600; }
.page-banner .btn{ position:relative; z-index:1; background:#fff; color:var(--navy); }
.page-banner .btn:disabled{ opacity:.5; cursor:not-allowed; }
.section-title{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; margin:20px 0 10px; display:flex; gap:8px; align-items:baseline; }
.section-title span{ font-family:'Inter',sans-serif; font-size:12.5px; color:var(--text-muted); font-weight:500; }
.rule-box{ background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-lg); padding:22px; text-align:center; color:var(--text-muted); }
.rule-box b{ display:block; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:16px; margin-bottom:6px; }
.rule-box code{ display:inline-block; margin-top:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--text); font-family:inherit; font-weight:600; }

/* ===== Apresentação ===== */
.show{ position:fixed; inset:0; z-index:80; background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%); color:#fff; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(18px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px); }
.show-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:13px; color:rgba(255,255,255,.8); }
.show-top img{ height:26px; }
.show-body{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:1100px; width:100%; margin:0 auto; min-height:0; overflow-y:auto; padding:16px 0; }
.show-cli{ font-size:clamp(14px,1.6vw,18px); color:var(--gold); font-weight:600; }
.show-opm{ font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,4.6vw,56px); font-weight:700; line-height:1.05; margin:4px 0 6px; }
.show-tt{ font-size:clamp(14px,1.6vw,19px); color:rgba(255,255,255,.82); max-width:70ch; }
.show-comment{ font-size:clamp(20px,2.6vw,32px); line-height:1.38; border-left:4px solid var(--gold); padding:4px 0 4px 22px; margin:26px 0 22px; max-width:46ch; overflow-wrap:anywhere; }
.show-stats{ display:flex; flex-wrap:wrap; gap:10px; }
.show-stats div{ background:rgba(255,255,255,.12); border-radius:12px; padding:10px 14px; min-width:140px; }
.show-stats b{ display:block; font-family:'Space Grotesk',sans-serif; font-size:clamp(17px,1.8vw,22px); }
.show-stats span{ font-size:12px; color:rgba(255,255,255,.78); }
.show-last{ margin-top:18px; font-size:14px; color:rgba(255,255,255,.8); max-width:80ch; }
.show-nav{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.show-nav .btn{ background:rgba(255,255,255,.14); color:#fff; padding:10px 16px; }
.show-nav .btn:hover{ background:rgba(255,255,255,.24); }
.show-nav .btn:disabled{ opacity:.35; cursor:default; }
.show-dots{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
.show-dots i{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); }
.show-dots i.on{ background:var(--gold); }

/* ===== Painel lateral de detalhe ===== */
.drawer-bg{ position:fixed; inset:0; background:rgba(8,14,18,.5); z-index:60; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(1000px,100%); background:var(--bg); z-index:61; overflow-y:auto; box-shadow:var(--shadow-2); padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 28px); }
.drawer-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:14px; }
.drawer-head h2{ margin:0; font-size:21px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.drawer-head p{ margin:3px 0 0; color:var(--text-muted); font-size:13px; }
.drawer .det{ grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); }
.drawer .det > .det-side{ grid-column:1 / -1; }
.drawer .det-side .kpi-grid{ grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
@media (max-width:700px){ .drawer .det{ grid-template-columns:1fr; } }
.match-box{ margin-top:10px; font-size:12.5px; background:color-mix(in srgb, var(--gold) 12%, transparent); border:1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius:10px; padding:9px 11px; }

/* ===== Tooltip ===== */
.tip{ position:fixed; z-index:50; pointer-events:none; background:var(--surface); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow-2); border-radius:10px; padding:8px 10px; font-size:12px; max-width:280px; opacity:0; transition:opacity .1s; }
.tip.on{ opacity:1; }
.tip b{ font-family:'Space Grotesk',sans-serif; font-size:13px; }
.tip .r{ display:flex; justify-content:space-between; gap:14px; margin-top:3px; }
.tip .r span:first-child{ color:var(--text-muted); }
</style>

.lock[hidden]{ display:none; }
.lock-card{ width:min(400px,100%); background:var(--surface); color:var(--text); border-radius:var(--radius-lg); padding:28px 26px 24px; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:12px; }
.lock-logo{ background:var(--navy); border-radius:12px; padding:12px 14px; align-self:flex-start; }
.lock-logo img{ height:28px; display:block; }
.lock-card h1{ margin:6px 0 0; font-size:21px; }
.lock-card p{ margin:0; color:var(--text-muted); font-size:13.5px; }

.lock-rem{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); cursor:pointer; }
.lock-card .btn{ justify-content:center; padding:11px 14px; font-size:14px; }
.lock-card .btn:disabled{ opacity:.7; cursor:wait; }
.lock-err{ min-height:18px; font-size:13px; color:var(--c-neg); font-weight:600; }

<script>
window.__kvmStart = function(RAW){
"use strict";
var REPORTS = RAW.reports, BX = RAW.bitrix || {};
var NOW = new Date();
var BITRIX_URL = "https://kvm.bitrix24.com.br/crm/deal/details/";

/* ---------- Formatação ---------- */
var nfMoney = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var nfInt = new Intl.NumberFormat("pt-BR");
var nfPct = new Intl.NumberFormat("pt-BR",{style:"percent",maximumFractionDigits:0});
function money(v){ return nfMoney.format(v||0); }
function moneyK(v){ v=v||0; if(Math.abs(v)>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi"; if(Math.abs(v)>=1000) return "R$ "+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil"; return money(v); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function pd(s){ if(!s) return null; var p=s.split(/[-T:]/); return new Date(+p[0],+p[1]-1,+p[2],+(p[3]||0),+(p[4]||0)); }
function fd(s,short){ var d=typeof s==="string"?pd(s):s; if(!d) return "—"; var dd=("0"+d.getDate()).slice(-2), mm=("0"+(d.getMonth()+1)).slice(-2); return short? dd+"/"+mm : dd+"/"+mm+"/"+d.getFullYear(); }
function fdt(s){ var d=pd(s); if(!d) return "—"; var h=d.getHours(), m=d.getMinutes(); return fd(d)+(h||m? " às "+("0"+h).slice(-2)+"h"+(m?("0"+m).slice(-2):""):""); }
function plural(n,s,p){ return nfInt.format(n)+" "+(n===1?s:p); }
function sum(a,f){ return a.reduce(function(t,x){ return t+(f(x)||0); },0); }
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

/* ---------- Situações ---------- */
var LEG = {
  "Urgentíssimo":{cls:"urg", c:"var(--c-urg)", ord:0, short:"Urgentíssimo"},
  "Normal":{cls:"nor", c:"var(--c-nor)", ord:1, short:"Normal"},
  "Não Concluído":{cls:"nc", c:"var(--c-nc)", ord:2, short:"Não concluído"}
};
function legInfo(l){ return LEG[l] || {cls:"muted", c:"var(--c-gasto)", ord:9, short:l||"Sem legenda"}; }
function legBadge(l){ var i=legInfo(l); return '<span class="badge '+i.cls+'">'+esc(i.short)+'</span>'; }
var BXS = {com:"Com contato registrado", sem:"Sem contato registrado", fora:"Fora da exportação"};
var BXS_SHORT = {com:"Com contato", sem:"Sem contato", fora:"Fora da exportação"};
var USERS = RAW.users || {}, MATCHES = RAW.matches || {};
function norm(t){ return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function userName(id){ return id ? (USERS[id] || null) : null; }

/* ---------- Etapas do faturamento ---------- */
var STAGES = [
  {k:"exec", l:"Em execução", one:"Em execução", d:"Projeto ainda não concluído", c:"var(--c-gasto)"},
  {k:"cli", l:"Aguardando cliente", one:"Aguardando cliente", d:"Concluído, esperando liberação ou aprovação do cliente", c:"var(--gold)"},
  {k:"proc", l:"Em faturamento", one:"Em faturamento", d:"Pedido enviado ou em processo no Financeiro", c:"var(--c-sav)"},
  {k:"fat", l:"Faturado", one:"Faturado", d:"Ganha no Bitrix e fora da lista do Faturamento", c:"var(--c-ok)"},
  {k:"cong", l:"Congeladas", one:"Congelada", d:"Fora da cobrança, aguardando devolutiva interna", c:"var(--c-plum)"}
];
/* Congelada: a observação do Faturamento diz "cliente não vai pagar" ou "congelada".
   Uma anotação posterior com "descongelada" tira a OPM desta etapa. */
function isFrozen(obs){
  var on = false;
  obs.forEach(function(n){ var t = norm(n); if(t.indexOf("descongelad")>=0) on = false; else if(t.indexOf("cliente nao vai pagar")>=0 || t.indexOf("congelad")>=0) on = true; });
  return on;
}
function stageInfo(k){ return STAGES.filter(function(x){return x.k===k;})[0]; }
var BILLING_RE = /processo de faturamento|pedido de faturamento|nf emitida|aprovacao de faturamento|faturamento realizado/;
function stageOf(r){
  if(r.fat) return "fat";
  if(isFrozen(r.obs)) return "cong";
  if(BILLING_RE.test(norm(r.obs.join(" "))) || r.acts.some(function(a){ return a.nf; })) return "proc";
  if(r.leg==="Não Concluído") return "exec";
  return "cli";
}

/* ---------- Cruzamento: pendência do Faturamento × atividades do Bitrix ---------- */
function enrich(r, repIdx){
  var b = BX[r.opm] || null, acts = b ? b.acts : [];
  var cont = acts.filter(function(a){ return a.k==="contato"; });
  var last = null;
  cont.forEach(function(a){ if(!last || a.criada > last.criada) last = a; });
  var open = cont.filter(function(a){ return !a.ok && a.agenda; }).sort(function(x,y){ return x.agenda<y.agenda?-1:1; });
  var next = open[0] || null;
  var weeks = [], first = null;
  for(var i=0;i<=repIdx;i++){
    var hit = null;
    REPORTS[i].rows.forEach(function(x){ if(x.opm===r.opm) hit = x; });
    weeks.push(hit ? hit.leg : null);
    if(hit && !first) first = REPORTS[i].date;
  }
  var bxName = b ? userName(b.respId) : null;
  var o = Object.assign({}, r, {
    bx:b, acts:acts, nCont:cont.length, nCob:acts.filter(function(a){return a.cob;}).length,
    last:last, next:next, late: !!(next && pd(next.agenda) < NOW),
    bxs: !b ? "fora" : (cont.length ? "com" : "sem"),
    weeks:weeks, nWeeks:weeks.filter(Boolean).length, first:first,
    respFat: r.resp || null, resp: bxName || r.resp || null, respSrc: bxName ? "bitrix" : "faturamento",
    pautas: acts.filter(function(a){ return a.pauta; }),
    match: MATCHES[r.opm] || null
  });
  o.stage = stageOf(o);
  return o;
}
/* OPMs ganhas no Bitrix (ou que já passaram pela lista) e que não estão na lista desta semana */
function faturados(repIdx){
  var cur = {}; REPORTS[repIdx].rows.forEach(function(r){ cur[r.opm]=1; });
  var lastSeen = {};
  for(var i=0;i<repIdx;i++) REPORTS[i].rows.forEach(function(r){ lastSeen[r.opm] = r; });
  var codes = {};
  Object.keys(BX).forEach(function(k){ if(BX[k].fase==="Oportunidade ganha") codes[k]=1; });
  Object.keys(lastSeen).forEach(function(k){ codes[k]=1; });
  var repDate = REPORTS[repIdx].date;
  return Object.keys(codes).filter(function(k){ return !cur[k]; }).map(function(k){
    var b = BX[k] || null, prev = lastSeen[k] || null;
    var negocio = b ? b.negocio : (prev ? prev.nome : k);
    var firstAct = b && b.acts.length ? b.acts.map(function(a){return a.criada;}).sort()[0] : null;
    var lastAct = b && b.acts.length ? b.acts.map(function(a){return a.criada;}).sort().slice(-1)[0] : null;
    var base = {
      opm:k, nome:negocio, titulo: String(negocio||"").replace(new RegExp("^.*?"+k+"\\s*[-–]*\\s*"),"").replace(/^[-–\s]+/,"") || negocio,
      cliente: prev ? prev.cliente : (b && b.cliente) || "Outros", clienteInferido: !prev,
      resp: prev ? prev.resp : null, leg:null,
      saldo: prev ? prev.saldo : (b && b.valor!=null ? b.valor : null), valorKnown: !!prev || !!(b && b.valor!=null), faturado:null, valorTotal: prev ? prev.valorTotal : null, fatDireto:null,
      fech: prev ? prev.fech : null, term: prev ? prev.term : null, dias:null, obs: prev ? prev.obs : []
    };
    var o = enrich(base, repIdx);
    o.fat = true; o.stage = "fat";
    o.nf = o.acts.some(function(a){ return a.nf; });
    o.saiu = prev ? prev : null;
    o.depois = !prev && firstAct && firstAct.slice(0,10) > repDate;
    o.lastAct = lastAct;
    o.fechou = b && b.fechamento ? b.fechamento : null;
    o.ordem = o.fechou || (lastAct ? lastAct.slice(0,10) : "");
    o.openCont = o.acts.some(function(a){ return a.k==="contato" && !a.ok; });
    if(!o.resp) o.resp = null;
    return o;
  });
}

/* ---------- Estado ---------- */
var state = {
  view:"overview", rep:REPORTS.length-1,
  f:{cli:"all", resp:"all", leg:"all", bxs:"all", etp:"ativas"},
  q:"", sort:{k:"dias", dir:-1}, rsort:{k:"obs", dir:-1}, open:{}, fatAll:false
};
function repRows(idx){ return REPORTS[idx].rows.map(function(r){ return enrich(r, idx); }); }
var F0 = {cli:"all", resp:"all", leg:"all", bxs:"all", etp:"ativas"};
function etpOk(r){ var e = state.f.etp; if(e==="all") return true; if(e==="cong") return r.stage==="cong"; return r.stage!=="cong"; }
function applyF(rows, keepEtp){
  var f = state.f;
  return rows.filter(function(r){
    if(!keepEtp && !etpOk(r)) return false;
    if(f.cli!=="all" && (r.cliente||"Sem cliente")!==f.cli) return false;
    if(f.resp!=="all" && (r.resp||"Sem responsável")!==f.resp) return false;
    if(f.leg!=="all" && r.leg!==f.leg) return false;
    if(f.bxs!=="all" && r.bxs!==f.bxs) return false;
    return true;
  });
}
function filtered(idx){ return applyF(repRows(idx==null?state.rep:idx)); }
function filteredAll(idx){ return applyF(repRows(idx==null?state.rep:idx), true); }
function filteredFat(idx){ return applyF(faturados(idx==null?state.rep:idx), true); }
function anyFilter(){ var f=state.f; return f.cli!=="all"||f.resp!=="all"||f.leg!=="all"||f.bxs!=="all"||f.etp!=="ativas"; }
function setFilter(k,v){ var off = k==="etp" ? "ativas" : "all"; state.f[k] = (state.f[k]===v ? off : v); render(); }
function findRow(opm){
  var r = repRows(state.rep).filter(function(x){return x.opm===opm;})[0];
  if(r) return r;
  r = faturados(state.rep).filter(function(x){return x.opm===opm;})[0];
  if(r) return r;

  return null;
}
function pautaItems(){

var tipEl = document.getElementById("tip");
function showTip(html,e){ tipEl.innerHTML = html; tipEl.classList.add("on"); moveTip(e); }
function moveTip(e){ if(!e) return; var w=tipEl.offsetWidth, h=tipEl.offsetHeight, x=e.clientX+14, y=e.clientY+14;
  if(x+w>window.innerWidth-8) x=e.clientX-w-14; if(y+h>window.innerHeight-8) y=e.clientY-h-14;
  tipEl.style.left=Math.max(6,x)+"px"; tipEl.style.top=Math.max(6,y)+"px"; }
function hideTip(){ tipEl.classList.remove("on"); }
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(function(el){
    el.addEventListener("pointerenter",function(e){ if(e.pointerType==="touch") return; showTip(el.getAttribute("data-tip"), e); });
    el.addEventListener("pointermove", moveTip);
    el.addEventListener("pointerleave", hideTip);
  });
}

/* ---------- Agrupamentos ---------- */
function groupBy(rows, fn){
  var m = {};
  rows.forEach(function(r){ var k=fn(r); if(!m[k]) m[k]={k:k, n:0, v:0, rows:[]}; m[k].n++; m[k].v+=r.saldo; m[k].rows.push(r); });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.v-a.v; });
}
function legSegments(rows, total){
  return groupBy(rows, function(r){return r.leg;}).sort(function(a,b){ return legInfo(a.k).ord-legInfo(b.k).ord; })
    .map(function(g){ return '<span style="width:'+(total? g.v/total*100 : 0)+'%;background:'+legInfo(g.k).c+'"></span>'; }).join("");
}
function barList(groups, key, max){
  if(!groups.length) return '<div class="empty-note">Nada para mostrar com os filtros atuais.</div>';
  return '<div class="bar-list">'+groups.map(function(g){
    var on = state.f[key]===g.k;
    return '<button class="bar-item'+(on?" sel":"")+'" data-k="'+esc(key)+'" data-v="'+esc(g.k)+'" data-tip="'+esc(tipRows(g.k,[["Saldo a faturar",money(g.v)],["OPMs",nfInt.format(g.n)]]))+'">'+
      '<span class="k">'+esc(g.k)+'<small>'+plural(g.n,"OPM","OPMs")+'</small></span>'+
      '<span class="track" style="width:'+Math.max(4,g.v/max*100)+'%">'+legSegments(g.rows, g.v)+'</span>'+
      '<span class="v">'+moneyK(g.v)+'</span></button>';
  }).join("")+'</div>';
}

/* ---------- Leitura rápida ---------- */
function insights(rows, total){
  var out = [];
  var byCli = groupBy(rows, function(r){ return r.cliente||"Sem cliente"; });
  if(byCli.length && total){
    var t = byCli[0];
    out.push({c:"var(--c-sav)", b:t.k+" concentra "+nfPct.format(t.v/total)+" do saldo", s:money(t.v)+" em "+plural(t.n,"OPM","OPMs")+" pendentes."});
  }
  var cons = {};
  rows.forEach(function(r){ r.obs.forEach(function(n){ var m=n.toUpperCase().match(/FATURAD[AO] NA (OPM\d+)/); if(m){ cons[m[1]]=cons[m[1]]||{}; cons[m[1]][r.opm]=r; } }); });
  var ck = Object.keys(cons).sort(function(a,b){ return Object.keys(cons[b]).length-Object.keys(cons[a]).length; })[0];
  if(ck){
    var cr = Object.keys(cons[ck]).map(function(k){ return cons[ck][k]; });
    out.push({c:"var(--c-mid)", b:plural(cr.length,"OPM depende","OPMs dependem")+" da "+ck, s:"Serão faturadas na "+ck+" e canceladas depois. Somam "+money(sum(cr,function(r){return r.saldo;}))+"."});
  } else {
    var byResp = groupBy(rows, function(r){ return r.resp||"Sem responsável"; });
    if(byResp.length) out.push({c:"var(--c-mid)", b:byResp[0].k+" responde por "+plural(byResp[0].n,"OPM","OPMs"), s:money(byResp[0].v)+" em saldo a faturar."});
  }
  var semNota = rows.filter(function(r){ return !r.obs.length; });
  if(semNota.length){
    var allNc = semNota.every(function(r){ return r.leg==="Não Concluído"; });
    out.push({c:"var(--c-neg)", b:plural(semNota.length,"OPM sem anotação","OPMs sem anotação")+" do Faturamento", s:"Somam "+money(sum(semNota,function(r){return r.saldo;}))+"."+(allNc?" Todas com projeto não concluído.":"")});
  } else {
    var old = rows.filter(function(r){return r.dias!=null;}).sort(function(a,b){return b.dias-a.dias;})[0];
    if(old) out.push({c:"var(--c-neg)", b:old.opm+" está há "+nfInt.format(old.dias)+" dias sem faturar", s:(old.cliente||"")+", saldo de "+money(old.saldo)+"."});
  }
  return out;
}

var BUCKETS = [
  {k:"Até 30 dias", t:function(d){return d<=30;}},

function renderRec(app){
  var rows = filtered();

function evoChart(series){
  var W=560, H=230, pl=56, pr=10, pt=16, pb=34, iw=W-pl-pr, ih=H-pt-pb;
  var max = Math.max.apply(null, series.map(function(s){return s.v;}).concat([1]));
  var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.ceil(max/step)*step; if(top/step<3) { step/=2; top=Math.ceil(max/step)*step; }
  var slot = Math.min(iw/Math.max(series.length,1), 90), bw = Math.min(54, slot*0.62);
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saldo a faturar por semana">';
  for(var g=0; g<=top+1e-6; g+=step){ var y=pt+ih-(g/top*ih); s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+(g>=1000? (g/1000).toLocaleString("pt-BR")+" mil" : g)+'</text>'; }
  series.forEach(function(se,i){
    var x = pl + slot*i + (slot-bw)/2, y0 = pt+ih;
    var segs = groupBy(se.rows,function(r){return r.leg;}).sort(function(a,b){ return legInfo(a.k).ord-legInfo(b.k).ord; });
    var tip = tipRows("Lista de "+fd(se.rep.date), [["Saldo a faturar",money(se.v)],["OPMs",nfInt.format(se.rows.length)]].concat(segs.map(function(g){return [legInfo(g.k).short, moneyK(g.v)];})));
    s += '<g class="hit'+(se.i===state.rep?" sel":"")+'" data-rep="'+se.i+'" data-tip="'+esc(tip)+'">';
    var yy = y0;
    segs.forEach(function(g){ var hh = g.v/top*ih; yy -= hh; s+='<rect x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+Math.max(0,hh)+'" fill="'+legInfo(g.k).c+'"/>'; });
    var th = se.v/top*ih;
    s += '<rect class="frame" x="'+x+'" y="'+(y0-th)+'" width="'+bw+'" height="'+th+'" fill="none" rx="2"/>';
    s += '<text class="lbl" x="'+(x+bw/2)+'" y="'+(y0-th-6)+'" text-anchor="middle">'+moneyK(se.v)+'</text>';
    s += '<text class="ax" x="'+(x+bw/2)+'" y="'+(H-14)+'" text-anchor="middle">'+fd(se.rep.date,true)+'</text></g>';
  });
  s += '</svg>';
  if(series.length===1) s += '<div class="empty-note" style="margin-top:8px">Primeira semana no painel. A partir da próxima lista, as colunas mostram a evolução do saldo semana a semana.</div>';
  return s;
}

  var cur = filtered(state.rep), prev = filtered(state.rep-1);

  var inn = cur.filter(function(r){return !pm[r.opm];}), out = prev.filter(function(r){return !cm[r.opm];}), stay = cur.filter(function(r){return pm[r.opm];});
  var dStay = sum(stay,function(r){return r.saldo-pm[r.opm].saldo;});
  h += '<p>Lista de '+fd(REPORTS[state.rep].date)+' comparada com a de '+fd(REPORTS[state.rep-1].date)+'.</p></div></div>';
  function chips(rr){ return rr.length? '<div class="mv-list">'+rr.sort(function(a,b){return b.saldo-a.saldo;}).map(function(r){ return '<button class="chip" data-opm="'+esc(r.opm)+'" title="'+esc(r.titulo)+'">'+esc(r.opm)+' '+moneyK(r.saldo)+'</button>'; }).join("")+'</div>' : ''; }
  h += '<div class="mv-grid">'+
    '<div class="mv"><div class="t" style="color:var(--c-ok)">'+out.length+'</div><div class="l">Saíram da lista</div><div class="s">'+money(sum(out,function(r){return r.saldo;}))+' que estavam pendentes</div>'+chips(out)+'</div>'+
    '<div class="mv"><div class="t" style="color:var(--c-urg)">'+inn.length+'</div><div class="l">Entraram na lista</div><div class="s">'+money(sum(inn,function(r){return r.saldo;}))+' em novas pendências</div>'+chips(inn)+'</div>'+
    '<div class="mv"><div class="t">'+stay.length+'</div><div class="l">Continuam pendentes</div><div class="s">Saldo '+(dStay>0.004?"subiu "+money(dStay):dStay<-0.004?"caiu "+money(-dStay):"sem variação")+'</div></div>'+
  '</div>';
  return h;
}
function drawRecTable(base){
  var wrap = document.getElementById("recTbl");
  if(!base.length){ wrap.innerHTML = emptyState(); bindEmpty(wrap); return; }
  var rows = sortRows(base, state.rsort, RCOLS);
  var h = '<div class="card-head"><div><h3>Recorrência por OPM</h3><p>Os quadradinhos mostram em quais listas semanais a OPM apareceu, da mais antiga para a mais recente. Clique numa OPM para abrir o detalhe.</p></div></div>';
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+RCOLS.map(function(c){ var on=state.rsort.k===c.k;
    return '<th class="sort'+(c.txt?" txt":"")+(on?" on":"")+'" data-s="'+c.k+'"'+(c.t?' title="'+esc(c.t)+'"':'')+'>'+c.l+(on?(state.rsort.dir>0?" ↑":" ↓"):"")+'</th>'; }).join("")+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr class="click" data-opm="'+esc(r.opm)+'" tabindex="0"><td class="opm-cell"><b>'+esc(r.opm)+'</b><div class="cell-sub">'+esc(r.cliente||"")+(r.cliente?", ":"")+esc(r.titulo)+'</div></td>'+
      '<td class="txt">'+legBadge(r.leg)+'</td>'+
      '<td><span class="weeks" title="'+esc(r.weeks.map(function(w,i){return fd(REPORTS[i].date,true)+": "+(w?legInfo(w).short:"fora da lista");}).join("\n"))+'">'+r.weeks.slice(-12).map(function(w){ return '<i style="'+(w?"background:"+legInfo(w).c+";border-color:"+legInfo(w).c:"")+'"></i>'; }).join("")+'</span> '+r.nWeeks+'</td>'+
      '<td><b>'+r.obs.length+'</b></td>'+
      '<td>'+(r.bx? r.nCont : '<span class="badge late plain">fora</span>')+'</td>'+
      '<td>'+(r.dias!=null? nfInt.format(r.dias) : '<span class="dim">—</span>')+'</td>'+
      '<td>'+money(r.saldo)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  wrap.innerHTML = h;
  wrap.querySelectorAll("th.sort").forEach(function(th){ th.onclick=function(){ var k=th.getAttribute("data-s"); if(state.rsort.k===k) state.rsort.dir*=-1; else state.rsort={k:k,dir:(k==="opm"||k==="leg")?1:-1}; drawRecTable(base); }; });
  wrap.querySelectorAll("tr.click").forEach(function(tr){ var go=function(){ openOpm(tr.getAttribute("data-opm")); }; tr.onclick=go; tr.onkeydown=function(e){ if(e.key==="Enter"){ go(); } }; });
}

/* ---------- Etapas (kanban) ---------- */
function kbCard(r){
  var openPauta = r.pautas.some(function(a){ return !a.ok; });
  var tag = r.leg ? legBadge(r.leg) : r.openCont ? '<span class="badge late">cobrança em aberto</span>' : (r.nf ? '<span class="badge done">NF registrada</span>' : (r.saiu ? '<span class="badge done">saiu da lista</span>' : (r.depois ? '<span class="badge open">ganha após a lista</span>' : '')));
  var right = r.fat ? (r.fechou ? 'fechada em '+fd(r.fechou) : r.lastAct ? 'atividade em '+fd(r.lastAct,true) : '') : (r.dias!=null ? nfInt.format(r.dias)+' dias' : 'em andamento');
  return '<button class="kb-card" style="--lc:'+(r.leg? legInfo(r.leg).c : 'var(--c-ok)')+'" data-drawer="'+esc(r.opm)+'">'+
    '<div class="top"><b>'+esc(r.opm)+'</b>'+tag+'</div>'+
    '<div class="cl">'+esc(r.cliente||"Sem cliente")+(r.resp?'<span style="font-weight:400">, '+esc(r.resp)+'</span>':'')+'</div>'+
    '<div class="tt">'+esc(r.titulo||"")+'</div>'+
    '<div class="bt"><b class="num">'+(r.saldo!=null? money(r.saldo) : '<span class="dim" style="font-weight:500">valor não informado</span>')+'</b>'+
      '<span class="dim">'+esc(right)+'</span>'+(openPauta?'<span class="badge open plain">pauta</span>':'')+(r.bxs==="fora"?'<span class="badge late plain">fora da exportação</span>':'')+'</div>'+
  '</button>';
}
function renderKanban(app){
  var rows = filteredAll(), fats = filteredFat();
  var h = '<div class="page-banner"><div><h2>Etapas do faturamento</h2><p>Em execução, Aguardando cliente, Em faturamento e Congeladas vêm da lista do Faturamento de '+fd(REPORTS[state.rep].date)+'. Faturado reúne as OPMs ganhas no Bitrix que não estão na lista. Clique num cartão para ver o detalhe.</p></div></div>';
  h += '<div class="kb">'+STAGES.map(function(st){
    var rr;
    if(st.k==="fat") rr = fats.slice().sort(function(a,b){ return (b.openCont-a.openCont) || (b.ordem > a.ordem ? 1 : b.ordem < a.ordem ? -1 : 0); });
    else rr = rows.filter(function(r){ return r.stage===st.k; }).sort(function(a,b){ return legInfo(a.leg).ord-legInfo(b.leg).ord || b.saldo-a.saldo; });
    var known = rr.filter(function(r){ return r.saldo!=null; }), v = sum(known,function(r){return r.saldo;});
    var lim = st.k==="fat" && !state.fatAll ? 30 : rr.length;
    return '<section class="kb-col" style="--sc:'+st.c+'" aria-label="'+esc(st.l)+'"><div class="kb-head"><h3>'+st.l+'<span>'+plural(rr.length,"OPM","OPMs")+'</span></h3>'+
      '<div class="v num">'+(st.k==="fat" && !known.length ? '<span class="dim" style="font-size:13px;font-weight:600">valor não vem na exportação</span>' : money(v))+'</div><p>'+esc(st.d)+'</p>'+
      (st.k==="fat" && rr.some(function(r){return r.openCont;}) ? '<p style="color:var(--c-neg);font-weight:600;margin-top:4px">'+plural(rr.filter(function(r){return r.openCont;}).length,"OPM ainda tem","OPMs ainda têm")+' cobrança em aberto no Bitrix. Confira se faltam na lista.</p>' : '')+'</div>'+
      '<div class="kb-list">'+(rr.length? rr.slice(0,lim).map(kbCard).join("") : '<div class="empty-note">Nenhuma OPM nesta etapa com os filtros atuais.</div>')+
      (rr.length>lim? '<button class="btn btn-ghost kb-more" id="fatAll">Mostrar todas as '+rr.length+'</button>':'')+'</div></section>';
  }).join("")+'</div>';
  app.innerHTML = h;
  var more = document.getElementById("fatAll"); if(more) more.onclick = function(){ state.fatAll = true; renderKanban(app); };
}

/* ---------- Pauta da reunião ---------- */
var PAUTA_FRASE = "Verificar na reunião com o Faturamento o status atual.";
function pautaComment(a){ return a.pautaTxt || (a.nota && norm(a.nota).indexOf("verificar na reuniao")<0 ? a.nota : "") || ""; }
function ptCard(x){
  var r = x.r, a = x.a, st = stageInfo(r.stage), c = pautaComment(a);
  var bxId = r.bx ? r.bx.respId : null;
  return '<article class="pt-card'+(a.ok?" done":"")+'">'+
    '<div class="pt-head"><div><b>'+esc(r.opm)+'</b> '+(r.leg? legBadge(r.leg) : '<span class="badge muted">'+esc(st?st.one:"")+'</span>')+
      '<div class="cell-sub">'+esc(r.cliente||"")+(r.cliente?", ":"")+esc(r.titulo||"")+'</div></div>'+
      '<div style="text-align:right"><b class="num">'+(r.saldo!=null? money(r.saldo):"—")+'</b><div class="cell-sub">'+(r.dias!=null? nfInt.format(r.dias)+" dias desde o término" : (st?st.one:""))+'</div></div></div>'+
    '<div class="pt-comment">'+(c? esc(c) : '<span class="dim">Sem comentário além da frase de pauta. Assunto: '+esc(a.assunto)+'</span>')+'</div>'+
    '<div class="pt-meta"><span>Registrado em <b>'+fd(a.criada)+'</b></span>'+(a.agenda?'<span>Prazo <b>'+fd(a.agenda)+'</b></span>':'')+
      '<span>Responsável <b>'+esc(userName(a.resp) || userName(bxId) || r.respFat || ("usuário "+(a.resp||bxId)))+'</b></span>'+
      '<span>'+(x.naLista? 'Na lista do Faturamento' : 'Fora da lista do Faturamento')+'</span>'+(a.ok?'<span class="badge done">tratada</span>':'')+'</div>'+
    (r.obs.length? '<div class="pt-last">Última anotação do Faturamento: <b>'+esc(r.obs[r.obs.length-1])+'</b></div>' : '')+
    '<div><button class="link-btn" data-drawer="'+esc(r.opm)+'">Ver detalhes da OPM</button></div>'+
  '</article>';
}
function renderPauta(app){
  var items = pautaItems();
  var open = items.filter(function(x){ return !x.a.ok; }).sort(function(x,y){ return legInfo(x.r.leg).ord-legInfo(y.r.leg).ord || (y.r.saldo||0)-(x.r.saldo||0); });
  var done = items.filter(function(x){ return x.a.ok; }).sort(function(x,y){ return x.a.criada<y.a.criada?1:-1; });
  var h = '<div class="page-banner"><div><h2>Pauta da reunião com o Faturamento</h2><p>Atividades do Bitrix com a frase de pauta entram aqui sozinhas, com o comentário pronto para apresentar na sexta.</p></div>'+
    '<button class="btn" id="showBtn"'+(open.length?'':' disabled')+'>Apresentar pauta</button></div>';
  if(!items.length){
    h += '<div class="rule-box"><b>Nenhuma atividade marcada para a reunião</b>Na exportação do Bitrix ('+fd(RAW.bitrixFrom)+' a '+fd(RAW.bitrixAt)+'), nenhuma atividade tem a frase de pauta. Escreva na descrição da atividade, junto com o comentário, e ela aparece aqui na próxima atualização:<br><code>'+esc(PAUTA_FRASE)+'</code></div>';
  } else {
    var ov = sum(open,function(x){return x.r.saldo;});
    h += '<div class="section-title">Para discutir <span>'+plural(open.length,"item","itens")+(ov? ', '+money(ov)+' a faturar':'')+'</span></div>';
    h += open.length? '<div class="pt-grid">'+open.map(ptCard).join("")+'</div>' : '<div class="empty-note">Todos os itens marcados já foram tratados.</div>';
    if(done.length) h += '<div class="section-title">Já tratadas <span>atividades concluídas no Bitrix</span></div><div class="pt-grid">'+done.map(ptCard).join("")+'</div>';
  }
  app.innerHTML = h;
  document.getElementById("showBtn").onclick = function(){ if(open.length) openShow(open); };
}

/* ---------- Modo apresentação ---------- */
var show = {i:0, items:[]};
function openShow(items){
  closeShow(); show.items = items; show.i = 0;
  var el = document.createElement("div"); el.className="show"; el.id="show"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Apresentação da pauta");
  document.body.appendChild(el); document.body.style.overflow="hidden"; drawShow();
  try{ if(el.requestFullscreen){ var pr = el.requestFullscreen(); if(pr && pr.catch) pr.catch(function(){}); } }catch(e){}
}
function closeShow(){
  var el = document.getElementById("show"); if(!el) return;
  try{ if(document.fullscreenElement && document.exitFullscreen){ var pr=document.exitFullscreen(); if(pr && pr.catch) pr.catch(function(){}); } }catch(e){}

}
function drawShow(){
  var el = document.getElementById("show"), n = show.items.length, x = show.items[show.i], r = x.r, a = x.a, st = stageInfo(r.stage), c = pautaComment(a);

  el.innerHTML = '<div class="show-top"><img src="'+logo+'" alt="KVM Pro AV"><span>Pauta da reunião com o Faturamento</span><button class="btn" id="shX" style="background:rgba(255,255,255,.14);color:#fff">Fechar</button></div>'+
    '<div class="show-body"><div class="show-cli">'+esc(r.cliente||"")+'</div><div class="show-opm">'+esc(r.opm)+'</div><div class="show-tt">'+esc(r.titulo||"")+'</div>'+
      '<div class="show-comment">'+(c? esc(c) : esc(a.assunto))+'</div>'+
      '<div class="show-stats"><div><b class="num">'+(r.saldo!=null? money(r.saldo):"—")+'</b><span>Saldo a faturar</span></div>'+
        '<div><b>'+(r.dias!=null? nfInt.format(r.dias)+" dias":"Em andamento")+'</b><span>Desde o término</span></div>'+
        '<div><b>'+esc(st?st.one:"—")+'</b><span>Etapa</span></div>'+
        '<div><b>'+esc(userName(a.resp) || userName(bxId) || r.respFat || "—")+'</b><span>Responsável</span></div></div>'+
      (r.obs.length? '<div class="show-last">Última anotação do Faturamento: '+esc(r.obs[r.obs.length-1])+'</div>' : '')+
    '</div>'+
    '<div class="show-nav"><button class="btn" id="shP"'+(show.i===0?" disabled":"")+'>Anterior</button>'+
      '<div style="text-align:center"><div class="show-dots">'+show.items.map(function(_,i){ return '<i class="'+(i===show.i?"on":"")+'"></i>'; }).join("")+'</div><div style="font-size:12.5px;margin-top:6px;color:rgba(255,255,255,.75)">'+(show.i+1)+' de '+n+'</div></div>'+
      '<button class="btn" id="shN"'+(show.i===n-1?" disabled":"")+'>Próxima</button></div>';
  document.getElementById("shX").onclick = closeShow;
  document.getElementById("shP").onclick = function(){ if(show.i>0){ show.i--; drawShow(); } };
  document.getElementById("shN").onclick = function(){ if(show.i<n-1){ show.i++; drawShow(); } };
}

/* ---------- Detalhe em painel lateral ---------- */
function openDrawer(opm){
  var r = findRow(opm); if(!r) return;
  closeDrawer(); hideTip();
  var st = stageInfo(r.stage);
  var bg = document.createElement("div"); bg.className="drawer-bg"; bg.id="drawerBg";
  var d = document.createElement("aside"); d.className="drawer"; d.id="drawer"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Detalhe da "+r.opm);
  d.innerHTML = '<div class="drawer-head"><div><h2>'+esc(r.opm)+' '+(r.leg? legBadge(r.leg) : '')+'<span class="badge muted plain">'+esc(st?st.one:"")+'</span></h2><p>'+esc(r.cliente||"")+(r.cliente?", ":"")+esc(r.titulo||"")+'</p></div>'+
    '<button class="btn btn-ghost btn-icon" id="drawerClose" aria-label="Fechar">✕</button></div>'+
    (!r.fat && !r.foraLista ? '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">'+
      kpi("Saldo a faturar", money(r.saldo))+kpi("Dias desde o término", r.dias!=null? nfInt.format(r.dias):"Não concluído")+
      kpi("Contatos no Bitrix", r.bx? nfInt.format(r.nCont) : "Fora da exportação")+kpi("Anotações", nfInt.format(r.obs.length))+'</div>' : '')+
    detailHtml(r);
  document.body.appendChild(bg); document.body.appendChild(d); document.body.style.overflow="hidden";
  bg.onclick = closeDrawer; var cb = document.getElementById("drawerClose"); cb.onclick = closeDrawer; cb.focus();
}
function closeDrawer(){ ["drawer","drawerBg"].forEach(function(id){ var e=document.getElementById(id); if(e) e.remove(); }); if(!document.getElementById("show")) document.body.style.overflow=""; }
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-drawer]") : null;
  if(t){ e.preventDefault(); e.stopPropagation(); openDrawer(t.getAttribute("data-drawer")); }
}, true);
document.addEventListener("keydown", function(e){
  if(document.getElementById("show")){
    if(e.key==="Escape") closeShow();
    else if(e.key==="ArrowRight" && show.i<show.items.length-1){ show.i++; drawShow(); }
    else if(e.key==="ArrowLeft" && show.i>0){ show.i--; drawShow(); }
    return;
  }
  if(e.key==="Escape") closeDrawer();
});
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement && document.getElementById("show")){ /* saiu da tela cheia: mantém a apresentação aberta */ } });

/* ---------- Vazio ---------- */
function emptyState(){ return '<div class="card"><div class="empty-state"><b>Nenhuma OPM com esses filtros</b><button class="link-btn" data-clear>Limpe os filtros</button> para ver a lista completa.</div></div>'; }
function bindEmpty(root){ var b=root.querySelector("[data-clear]"); if(b) b.onclick=function(){ state.f=Object.assign({},F0); render(); }; }

/* ---------- Render ---------- */
function render(){
  hideTip(); renderNav(); renderTopbar();
  var app = document.getElementById("app");
  closeDrawer();
  if(state.view==="pend") renderPend(app); else if(state.view==="rec") renderRec(app); else if(state.view==="kanban") renderKanban(app); else if(state.view==="pauta") renderPauta(app); else renderOverview(app);
}
render();
};

    <h1 id="lockTitle">Recorrência de cobrança</h1>
    <p>Painel protegido. Digite a senha para abrir.</p>
    <input type="text" name="username" value="painel-recorrencia-kvm" autocomplete="username" hidden>
    <label for="lockPw" class="sr">Senha</label>
    <input type="password" id="lockPw" autocomplete="current-password" placeholder="Senha" required>
    <label class="lock-rem"><input type="checkbox" id="lockRem"> Lembrar neste computador</label>
    <button class="btn btn-primary" type="submit" id="lockGo">Entrar</button>
    <div class="lock-err" id="lockErr" role="alert"></div>
  </form>
</div>
<script>
(function(){
"use strict";
var L = JSON.parse(document.getElementById("kvm-lock").textContent);
var STORE = "kvm-painel-chave-" + L.kdf.salt.slice(0,12);
var lock = document.getElementById("lock"), form = document.getElementById("lockForm"), pw = document.getElementById("lockPw");
var rem = document.getElementById("lockRem"), go = document.getElementById("lockGo"), err = document.getElementById("lockErr");
var shell = document.querySelector(".app-shell");
shell.style.display = "none";
function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
function toB64(buf){ var u = new Uint8Array(buf), s = ""; for(var i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); }
function lsGet(){ try{ return localStorage.getItem(STORE); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(STORE, v); }catch(e){} }
function lsDel(){ try{ localStorage.removeItem(STORE); }catch(e){} }
function kekFrom(senha){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(L.kdf.salt), iterations:L.kdf.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function abrir(kek){
  return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.priv.iv)}, kek, b64(L.priv.ct))
    .then(function(pk8){ return crypto.subtle.importKey("pkcs8", pk8, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]); })
    .then(function(priv){ return crypto.subtle.decrypt({name:"RSA-OAEP"}, priv, b64(L.data.key)); })
    .then(function(dek){ return crypto.subtle.importKey("raw", dek, "AES-GCM", false, ["decrypt"]); })
    .then(function(dek){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.data.iv)}, dek, b64(L.data.ct)); })
    .then(function(gz){ return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); })
    .then(function(t){ return JSON.parse(t); });
}
function iniciar(raw){
  lock.hidden = true; shell.style.display = "";
  window.__kvmLock = function(){ lsDel(); location.reload(); };
  window.__kvmStart(raw);
}
function pronto(){ return !!(window.crypto && crypto.subtle && window.DecompressionStream); }
if(!pronto()){
  err.textContent = "Este navegador não consegue abrir o painel. Use uma versão atual do Chrome, Edge, Firefox ou Safari.";
  go.disabled = true; return;
}
var salva = lsGet();
if(salva){
  crypto.subtle.importKey("raw", b64(salva), "AES-GCM", true, ["decrypt"]).then(abrir).then(iniciar).catch(function(){ lsDel(); pw.focus(); });
} else { pw.focus(); }
form.addEventListener("submit", function(e){
  e.preventDefault();
  if(!pw.value) return;
  err.textContent = ""; go.disabled = true; go.textContent = "Abrindo…";
  var chave;
  kekFrom(pw.value).then(function(k){ chave = k; return abrir(k); }).then(function(raw){
    if(rem.checked){ return crypto.subtle.exportKey("raw", chave).then(function(b){ lsSet(toB64(b)); return raw; }); }
    return raw;
  }).then(iniciar).catch(function(){
    err.textContent = "Senha incorreta."; go.disabled = false; go.textContent = "Entrar"; pw.select();
  });
});
})();
</script>
